---
# Create a Podman volume to persist the telemt configuration file
- name: Create telemt config podman volume
  containers.podman.podman_volume:
    name: "{{ telemt_config_volume }}"
    state: present

- name: Ensure telemt config directory exists
  ansible.builtin.file:
    path: "{{ telemt_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Render telemt config file
  ansible.builtin.template:
    src: telemt.toml.j2
    dest: "{{ telemt_config_path }}"
    mode: "0644"
  register: telemt_config_template

# Run the telemt container using the config podman volume.
# The volume holds the generated config, mounted writable at /etc/telemt so the
# API can save configuration changes (atomic writes require directory access).
# The parameter set lives in vars/main.yml (telemt_container_spec) so the run
# task and the recreate task below share one container definition.
# noqa args[module]: all parameters live in telemt_container_spec (vars/main.yml)
- name: Run telemt podman container  # noqa args[module]
  containers.podman.podman_container: "{{ telemt_container_spec }}"

# When the rendered config changed, copy it into the volume and recreate the
# container so telemt reads the new file. The CLI reads the file from the role
# host (a molecule instance in tests, the target machine in production) and
# streams it into the container's volume mount, so no host-path bind on the
# engine is needed (a helper container binding the file would fail in
# molecule, where the rendered path does not exist on the engine host).
# noqa no-handler: on purpose inline, the copy must run in the role's task
# order right before the recreate, not at the end of the play
- name: Copy rendered config into telemt config volume  # noqa no-handler
  ansible.builtin.command:
    cmd: >-
      podman cp
      {{ telemt_config_path }}
      {{ telemt_container_name }}:{{ telemt_container_config_path }}
  changed_when: true
  when: telemt_config_template is changed

# noqa no-handler: on purpose inline, must follow the config copy in the
# role's task order; noqa args[module]: parameters live in the shared spec
- name: Recreate telemt podman container  # noqa no-handler args[module]
  containers.podman.podman_container: "{{ telemt_container_spec | combine({'recreate': true}) }}"
  when: telemt_config_template is changed
