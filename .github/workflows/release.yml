---
name: Release
'on':
  push:
    # Only v-prefixed tags can trigger a release; a strict semver check runs
    # in the release job so e.g. 'v1.0' or 'v1.0.0-typo' fail fast
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize runs for the same tag without cancelling: a replaced tag must not
# drop an in-flight release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-core:
    name: CI Core
    uses: ./.github/workflows/ci-core.yml

  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: ci-core

    steps:
      - name: Validate tag is a semantic version
        run: |
          if ! echo "${{ github.ref_name }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${{ github.ref_name }}' is not a semantic version (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Notify ansible-galaxy
        uses: robertdebock/galaxy-action@1.2.0
        with:
          git_branch: ${{ github.ref_name }}
          galaxy_api_key: ${{ secrets.galaxy_api_key }}
