---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref cancels the still-running previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-core:
    name: CI Core
    uses: ./.github/workflows/ci-core.yml
