---
name: CI Core

'on':
  workflow_call:

permissions:
  contents: read

env:
  ANSIBLE_FORCE_COLOR: '1'
  PY_COLORS: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Cache ansible collections
        uses: actions/cache@v4.3.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-{{ hashFiles('requirements.yml') }}
          restore-keys: |
            ansible-collections-${{ runner.os }}-

      - name: Install ansible dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run linter
        run: |
          yamllint .
          ansible-lint .

  test-almalinux:
    name: Molecule test - AlmaLinux 9.x
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        tag: ['9.0', '9.1', '9.2']

    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: pip3 install -r requirements.txt

      - name: Cache ansible collections
        uses: actions/cache@v4.3.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-{{ hashFiles('requirements.yml') }}
          restore-keys: |
            ansible-collections-${{ runner.os }}-

      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          sudo systemctl start podman.socket

      - name: Install ansible dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule tests
        run: molecule test
        env:
          MOLECULE_DISTR: kirillzak/docker-almalinux-ansible
          MOLECULE_TAG: ${{ matrix.tag }}

