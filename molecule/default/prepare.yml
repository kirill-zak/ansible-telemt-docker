---
# No become: the instance container runs as root by default, and a sudo
# wrapper would strip CONTAINER_HOST from the module environment, forcing
# the podman CLI into local (non-remote) mode
- name: Prepare
  hosts: all

  pre_tasks:
    # The instance boots its native systemd init; give it a moment to finish
    # so the service/package tasks below never race with boot.
    - name: Wait for systemd to complete initialization.  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-system-running
      register: systemctl_status
      until: >
        'running' in systemctl_status.stdout or
        'degraded' in systemctl_status.stdout
      retries: 30
      delay: 5
      when: ansible_service_mgr == 'systemd'
      changed_when: false
      failed_when: systemctl_status.rc > 1

  tasks:
    # The containers.podman modules shell out to the podman CLI, which reaches
    # the host podman engine through the socket mounted in molecule.yml
    # (CONTAINER_HOST is set in the platform env). Only the CLI is required;
    # kirill_zak.ansible_podman installs it the distro-appropriate way
    # (apk/apt/dnf/yum) and handles the Fedora dnf5 backend itself.
    - name: Install Podman CLI
      ansible.builtin.include_role:
        name: kirill_zak.ansible_podman
