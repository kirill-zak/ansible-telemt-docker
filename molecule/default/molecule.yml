---
dependency:
  name: galaxy
lint: |
  set -e
  yamllint .
  ansible-lint .
driver:
  name: podman
platforms:
  - name: instance
    # Prebuilt distro image; the instance only needs to stay alive because the
    # podman connection execs commands directly (no init/sshd required)
    image: "${MOLECULE_DISTR:-kirillzak/docker-alpine-ansible}:${MOLECULE_TAG:-latest}"
    command:
      - sh
      - -c
      - while true; do sleep 10000; done
    # Mount the host podman socket so the role manages host-engine containers
    volumes:
      - ${MOLECULE_PODMAN_SOCKET:-/run/podman/podman.sock}:${MOLECULE_PODMAN_SOCKET:-/run/podman/podman.sock}:ro
    env:
      # The unified podman client (>= 4.0) selects the engine through
      # CONTAINER_HOST; the legacy PODMAN_HOST variable is ignored
      CONTAINER_HOST: unix://${MOLECULE_PODMAN_SOCKET:-/run/podman/podman.sock}
    pre_build_image: true
    # Rootful by default (matches CI runners); override with
    # MOLECULE_PODMAN_ROOTLESS=true for rootless setups
    rootless: ${MOLECULE_PODMAN_ROOTLESS:-false}
provisioner:
  name: ansible
  connection_options:
    # Rootful (root) `podman mount` returns a usable-looking but non-live
    # /var/lib/containers/storage/overlay/<id>/merged path; the podman
    # connection plugin then writes ansible modules there via the host fs and
    # fails with FileNotFoundError because the tmp dir exists only inside the
    # running container. Setting a remote_user makes the plugin always use
    # `podman cp`, which is reliable regardless of the mount state; disabling
    # mount detection keeps it on `podman cp` even if a mount happens to work.
    ansible_user: root
    ansible_podman_mount_detection: false
  env:
    # RHEL-family and Fedora images ship a read-only /root; keep the remote
    # tmp dir in world-writable /tmp so tempdir setup does not fail
    ANSIBLE_REMOTE_TMP: /tmp/.ansible/tmp
verifier:
  name: ansible
