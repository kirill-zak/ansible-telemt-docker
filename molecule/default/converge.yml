---
# No become: the instance container runs as root by default, and a sudo
# wrapper would strip CONTAINER_HOST from the module environment, forcing
# the podman CLI into local (non-remote) mode
- name: Converge
  hosts: all

  vars:
    # The role defaults define no access users and telemt refuses to start
    # with an empty [access.users] section; give the molecule run a fixed
    # test user
    telemt_access_users:
      molecule-test: "0123456789abcdef0123456789abcdef"

  tasks:
    # The podman driver execs commands into a long-running sleep container,
    # so no init/service wait is needed before converge.
    - name: "Include kirill_zak.ansible_telemt_docker"
      ansible.builtin.include_role:
        name: "kirill_zak.ansible_telemt_docker"
