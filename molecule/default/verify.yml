---
# No become: the instance container runs as root by default, and a sudo
# wrapper would strip CONTAINER_HOST from the module environment, forcing
# the podman CLI into local (non-remote) mode
- name: Verify
  hosts: all

  tasks:
    - name: Get rendered telemt config facts
      ansible.builtin.stat:
        path: /etc/telemt/telemt.toml
      register: telemt_config_stat

    - name: Assert telemt config file exists and is non-empty
      ansible.builtin.assert:
        that:
          - telemt_config_stat.stat.exists
          - telemt_config_stat.stat.size | int > 0
        fail_msg: Rendered telemt config is missing or empty

    - name: Read rendered telemt config
      ansible.builtin.slurp:
        src: /etc/telemt/telemt.toml
      register: telemt_config_content
      when: telemt_config_stat.stat.exists

    - name: Decode rendered telemt config text
      ansible.builtin.set_fact:
        telemt_config_text: "{{ telemt_config_content.content | b64decode }}"
      when: telemt_config_stat.stat.exists

    - name: Assert config renders expected key settings
      ansible.builtin.assert:
        that:
          - "'[server]' in telemt_config_text"
          - "'port = 443' in telemt_config_text"
          - "'[access.users]' in telemt_config_text"
          - "'molecule-test' in telemt_config_text"
        fail_msg: Rendered config lacks expected [server]/port/access sections
      when: telemt_config_stat.stat.exists

    - name: Get telemt config podman volume info
      containers.podman.podman_volume_info:
        name: telemt-config
      register: telemt_volume_info

    - name: Assert telemt config podman volume exists
      ansible.builtin.assert:
        that:
          - telemt_volume_info.volumes | length > 0
        fail_msg: Podman volume 'telemt-config' was not created

    - name: Get telemt podman container info
      containers.podman.podman_container_info:
        name: telemt
      register: telemt_container_info

    - name: Assert telemt podman container is running and stable
      ansible.builtin.assert:
        that:
          - telemt_container_info.containers | length > 0
          - telemt_container_info.containers[0].State.Running
          # RestartCount > 1 means the container crash-loops (e.g. the config
          # in the volume is invalid); a clean startup restarts at most once
          - telemt_container_info.containers[0].RestartCount | default(0) | int <= 1
        fail_msg: Podman container 'telemt' is missing, not running, or crash-looping
