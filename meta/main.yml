---
galaxy_info:
  author: kirill_zak
  role_name: ansible_telemt_docker
  description: >-
    Deploy the TelemT MTProto proxy for Telegram as a hardened Podman container
  company: https://kirill-zak.ru
  license: MIT
  min_ansible_version: '2.12'
  # The role only manages a target engine through the unified podman client
  # (>= 4.0, CONTAINER_HOST); older 3.x clients are not supported. Platform
  # versions mirror the CI test matrix.
  platforms:
    - name: Alpine
      versions:
        - all
    - name: Debian
      versions:
        - bookworm
    - name: EL
      versions:
        - "9"
    - name: Fedora
      versions:
        - "41"
        - "42"
    - name: Ubuntu
      versions:
        - noble
  galaxy_tags:
    - podman
    - proxy

dependencies: []
